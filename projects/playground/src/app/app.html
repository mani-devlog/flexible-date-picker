<div class="site-shell">
  <header class="site-nav">
    <a class="site-nav__brand" routerLink="/">
      <img class="site-nav__logo" src="app-icon.png" width="28" height="28" alt="" />
      FlexibleDatePicker
    </a>
    <nav class="site-nav__links" aria-label="Primary">
      <a
        class="site-nav__link"
        routerLink="/features"
        routerLinkActive="site-nav__link--active"
      >
        Features
      </a>
      <a
        class="site-nav__link"
        routerLink="/docs"
        routerLinkActive="site-nav__link--active"
        [routerLinkActiveOptions]="{ exact: false }"
      >
        Documentation
      </a>
      <a
        class="site-nav__link"
        routerLink="/"
        routerLinkActive="site-nav__link--active"
        [routerLinkActiveOptions]="{ exact: true }"
      >
        Examples
      </a>
    </nav>
    <div class="site-nav__actions">
      <button
        type="button"
        class="site-nav__icon-btn"
        (click)="toggleDarkMode()"
        [attr.aria-label]="darkMode() ? 'Switch to light mode' : 'Switch to dark mode'"
      >
        @if (darkMode()) {
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true">
            <circle cx="12" cy="12" r="4"></circle>
            <path d="M12 2v2M12 20v2M4.93 4.93l1.41 1.41M17.66 17.66l1.41 1.41M2 12h2M20 12h2M4.93 19.07l1.41-1.41M17.66 6.34l1.41-1.41"></path>
          </svg>
        } @else {
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true">
            <path d="M21 12.79A9 9 0 1 1 11.21 3 7 7 0 0 0 21 12.79z"></path>
          </svg>
        }
      </button>
      <a class="site-nav__github" [href]="githubUrl" target="_blank" rel="noopener noreferrer">GitHub</a>
    </div>
  </header>

  <router-outlet />

  <footer class="site-footer">
    <div class="site-footer__inner">
      <div class="site-footer__brand">
        <h2>FlexibleDatePicker</h2>
        <p>Headless Angular date and time pickers with flexible configuration and theming.</p>
        <p class="site-footer__copyright">© {{ currentYear }} FlexibleDatePicker. All rights reserved.</p>
        <label class="site-footer__locale">
          <span class="visually-hidden">Locale</span>
          <select [value]="selectedLocale()" (change)="onLocaleChange($any($event.target).value)">
            <option value="en">English</option>
            <option value="fr">Français</option>
            <option value="de">Deutsch</option>
            <option value="ar">العربية (RTL)</option>
          </select>
        </label>
      </div>
      <div class="site-footer__column">
        <h3>Resources</h3>
        <ul class="site-footer__links">
          <li><a routerLink="/features">Features</a></li>
          <li><a routerLink="/docs">Documentation</a></li>
          <li><a routerLink="/docs" fragment="api-reference">API Reference</a></li>
          <li><a routerLink="/">Examples</a></li>
        </ul>
      </div>
    </div>
  </footer>
</div>
